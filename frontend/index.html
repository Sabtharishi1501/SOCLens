<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOCLens — SOC Maturity Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">

  <header class="masthead">
    <h1>SOCLens</h1>
    <p class="tagline">Evidence-based maturity scoring for your incident response SOP, checked against what's actually written down — nothing assumed.</p>
  </header>

  <section id="upload-section" class="panel upload-panel">
    <label for="file-input" class="dropzone" id="dropzone">
      <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="dropzone-text" id="dropzone-text">Drop your SOP here, or choose a file</span>
      <span class="dropzone-hint">.pdf, .docx, or .txt</span>
      <input type="file" id="file-input" accept=".pdf,.docx,.txt" hidden />
    </label>
    <button id="run-button" class="run-button" disabled>Run assessment</button>
    <p id="error-message" class="error-message" hidden></p>
  </section>

  <section id="loading-section" class="loading-panel" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">Reading the document…</p>
  </section>

  <section id="results-section" class="results-section" hidden>
    <div class="results-meta" id="results-meta"></div>
    <div id="results-list" class="results-list"></div>
    <button id="reset-button" class="reset-button">Assess another document</button>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
